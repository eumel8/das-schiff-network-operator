name: Build test images

on:
  push:
    branches:
      - fix/macvlan-fdb-stale-cleanup
    tags:
      - 'v*-macvlansync'
      - 'v*-cni-nodad'

jobs:
  build-macvlansync:
    name: Build macvlansync-watcher
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag or branch
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == *-macvlansync ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            VERSION="${VERSION%-macvlansync}"
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push macvlansync-watcher
        uses: docker/build-push-action@v6
        with:
          context: .
          file: macvlansync-watcher.Dockerfile
          push: true
          tags: ghcr.io/eumel8/macvlansync-watcher:${{ steps.version.outputs.tag }}
          platforms: linux/amd64

  build-cni-nodad:
    name: Build cni-nodad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag or branch
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == *-cni-nodad ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            VERSION="${VERSION%-cni-nodad}"
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push cni-nodad
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cni-nodad.Dockerfile
          push: true
          tags: ghcr.io/eumel8/cni-nodad:${{ steps.version.outputs.tag }}
          platforms: linux/amd64
